name: nest-e-commerce

services:
  api:
    container_name: e-commerce_api
    build:
      pull: true
      context: ../.
      dockerfile: ./docker/local.Dockerfile
    env_file: ./container.env
    ports:
      - ${PORT}:${PORT}
    develop:
      watch:
        - action: sync
          path: ../.
          target: /app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ../package.json
        - action: rebuild
          path: ../pnpm-lock.yaml
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
    profiles:
      - backend

  postgres:
    container_name: e-commerce_postgres
    image: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    env_file: ./container.env
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./entrypoint.sh:/docker-entrypoint-initdb.d/entrypoint.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infrastructure
      - backend
    profiles:
      - infrastructure
      - backend

  mongo:
    container_name: e-commerce_mongo-main
    image: mongo:latest
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_USER_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
    ports:
      - ${MONGO_PORT:-27017}:27017
    expose:
      - 27017
    env_file: ./container.env
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/${MONGO_DATABASE} --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infrastructure
      - backend
    profiles:
      - infrastructure
      - backend

  redis:
    container_name: e-commerce_redis
    image: redis
    restart: unless-stopped
    command: 'redis-server --requirepass ${REDIS_PASSWORD}'
    ports:
      - ${REDIS_PORT:-6379}:6379
    expose:
      - ${REDIS_PORT:-6379}
    env_file: ./container.env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infrastructure
      - backend
    profiles:
      - infrastructure
      - backend

  minio:
    container_name: e-commerce_minio
    image: minio/minio
    restart: unless-stopped
    command: server /data/minio --console-address ":${MINIO_ADMIN_PORT:-9001}"
    ports:
      - ${MINIO_PORT:-9000}:9000
      - '${MINIO_ADMIN_PORT:-9001}:9001'
    expose:
      - ${MINIO_PORT:-9000}
    env_file: ./container.env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - infrastructure
      - backend
    profiles:
      - infrastructure
      - backend

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:

networks:
  backend:
  infrastructure:
